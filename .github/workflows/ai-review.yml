name: AI-ревью

on: pull_request

permissions:
  contents: read
  pull-requests: write

# новый пуш в PR отменяет ревью предыдущего
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # нужны оба конца PR: основная ветка и ветка с изменениями
      - uses: Dashkin-G/ai-advent-challenge-9-week-7@main
